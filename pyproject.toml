[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reason-x"
version = "0.1.0"
description = "Industrial-grade Distributed Foundation Model Pretraining, Scaling, Reasoning RL & Test-Time Compute Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "regex>=2023.12.25",
    "sympy>=1.12",
    "pytest>=7.4.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
